<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d5a27; }
  </style>
</head>
<body>
  <h1>Hello, World</h1>
  <svg width="240" height="340" viewBox="0 0 240 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A red rose seen from above">
    <!-- stem -->
    <path d="M120 190 C128 240 112 285 120 335" stroke="#1b5e20" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M123 270 C165 240 205 255 215 232 C205 280 160 295 123 270 Z" fill="#388e3c" stroke="#1b5e20" stroke-width="2"/>
    <path d="M118 300 C78 272 40 285 28 262 C42 308 85 322 118 300 Z" fill="#388e3c" stroke="#1b5e20" stroke-width="2"/>
    <!-- top-down bloom: concentric petal rings -->
    <g transform="translate(120 105)" stroke="#6a0000" stroke-width="2">
      <g fill="#a50f15">
        <circle cx="0" cy="-52" r="34"/>
        <circle cx="50" cy="-16" r="34"/>
        <circle cx="31" cy="42" r="34"/>
        <circle cx="-31" cy="42" r="34"/>
        <circle cx="-50" cy="-16" r="34"/>
        <circle cx="0" cy="0" r="64"/>
      </g>
      <g fill="#c4161c">
        <circle cx="0" cy="-34" r="26"/>
        <circle cx="32" cy="-10" r="26"/>
        <circle cx="20" cy="27" r="26"/>
        <circle cx="-20" cy="27" r="26"/>
        <circle cx="-32" cy="-10" r="26"/>
        <circle cx="0" cy="0" r="44"/>
      </g>
      <g fill="#e02f2f">
        <circle cx="0" cy="0" r="30"/>
      </g>
      <!-- spiral heart of the rose -->
      <path d="M0 -4 C10 -6 14 6 4 12 C-10 18 -22 2 -14 -12 C-6 -26 18 -22 22 -6" fill="none" stroke="#6a0000" stroke-width="3" stroke-linecap="round"/>
      <path d="M-2 2 C2 0 4 4 0 6" fill="none" stroke="#6a0000" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </svg>
</body>
</html>
